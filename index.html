function geo(cb){if(!navigator.geolocation)return say("Location is not available on this device");say("Finding your location…");navigator.geolocation.getCurrentPosition(p=>cb({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),e=>say(e.code==1?"Location permission was denied. Allow it in your browser settings.":"Could not get your location. Try again."),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function saveLoc(){try{localStorage.setItem("sc_loc",JSON.stringify(S.loc))}catch(e){}}
try{const l=JSON.parse(localStorage.getItem("sc_loc")||"null");if(l&&okC(l))S.loc=l}catch(e){}
function useMyLocation(){geo(p=>{S.loc=p;saveLoc();render();say("Location saved. The fee now uses your distance.")})}
function mapFrame(c,z){const q=c?c.lat+","+c.lng:encodeURIComponent((S.area&&S.area!="__o"?S.area+", ":"")+Z[S.zone].n+", Western Region, Ghana");return `<iframe class="mapf" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${q}&z=${z||(c?(c.src=="gps"?16:13):13)}&output=embed"></iframe>`}

function zoneLocRow(i){const z=Z[i];return `<p class="mu" style="margin:10px 0 6px">Centre of ${esc(z.n)} (used for the map, and for the fee when a customer has not shared a location)</p><div class="row" style="flex-wrap:wrap"><input class="inp" id="zla${i}" style="width:120px;margin:0" placeholder="Latitude" value="${okC(z)?z.lat:""}"><input class="inp" id="zln${i}" style="width:120px;margin:0" placeholder="Longitude" value="${okC(z)?z.lng:""}"><button class="chip" style="margin:0" onclick="zoneHere(${i})">📍 I am here</button><button class="btn" style="width:auto" onclick="setZoneLoc(${i})">Save</button></div>`}

   subs.push(onSnapshot(collection(db,"users"),s=>h.users(s.docs.map(d=>({id:d.id,...d.data()}))),err))}
  return subs.map(u=>()=>u())}
};

function buildRouter({FS,SQ,sqlOn,emit,getSess}){
 let act="fs",mirrorErr="";
 const quota=e=>!!e&&(e.code==="resource-exhausted"||/quota|resource.?exhausted/i.test(String((e&&e.message)||"")));
 const toSql=why=>{if(act==="sql"||!sqlOn())return false;act="sql";emit("sql",why);return true};
 const FB={...FS},bg=(p)=>Promise.resolve().then(p).then(()=>{mirrorErr=""},e=>{mirrorErr=String((e&&e.message)||e)});
 const WRITE=["saveVendor","saveSettings","saveOrder","seedVendors","saveAnn","delAnn","saveBranding","saveLoader","saveSignup","setUser","delField","createReq","setReq","addAdmin","removeAdmin","claimAdmin","rate"];
 WRITE.forEach(m=>{FB[m]=async(...a)=>{
  if(act==="sql")return SQ[m](...a);
  let r;try{r=await FS[m](...a)}catch(e){if(quota(e)&&toSql("write"))return SQ[m](...a);throw e}
  if(sqlOn())bg(()=>SQ[m](...a));return r}});
 ["subBranding","subLoader","subSignup","subAdmin","subUser","subMyReq"].forEach(m=>{FB[m]=(...a)=>(act==="sql"?SQ:FS)[m](...a)});
 FB.subscribe=(h,ctx)=>{const h2={...h,error:e=>{if(quota(e)&&(act==="sql"||toSql("read")))return;h.error&&h.error(e)},
  users:l=>{if(SQ.remember)l.forEach(u=>SQ.remember(u.id,u.phone));h.users&&h.users(l)},reqs:l=>{if(SQ.remember)l.forEach(q=>SQ.remember(q.id,q.phone));h.reqs&&h.reqs(l)}};
  return(act==="sql"?SQ:FS).subscribe(h2,ctx)};
 FB.hasBootstrap=()=>act==="sql"?SQ.hasBootstrap():FS.hasBootstrap().catch(e=>{if(quota(e)&&toSql("read"))return SQ.hasBootstrap();throw e});
 FB.signIn=async(p,pw)=>{await FS.signIn(p,pw);if(sqlOn())bg(async()=>{await SQ.ensureAuth(p,pw);await SQ.syncSelf(FS.auth.currentUser.uid)})};
 FB.signUp=async(p,pw,prof)=>{let uid;try{uid=await FS.signUp(p,pw,prof)}catch(e){if(quota(e)&&sqlOn()&&FS.auth.currentUser){uid=FS.auth.currentUser.uid;toSql("write");await SQ.ensureAuth(p,pw);await SQ.setUser(uid,{...prof,created:Date.now()});return uid}throw e}
  if(sqlOn())bg(async()=>{await SQ.ensureAuth(p,pw);await SQ.syncSelf(uid)});return uid};
 FB.signOutF=async()=>{if(sqlOn())try{await SQ.signOutF()}catch(e){}return FS.signOutF()};
 FB.changePassword=async(c,n)=>{await FS.changePassword(c,n);if(sqlOn())bg(()=>SQ.changePassword(c,n))};
 FB.changePhone=async(pw,np)=>{await FS.changePhone(pw,np);if(sqlOn())bg(()=>SQ.changePhone(pw,np))};
 FB.deleteMe=async()=>{if(sqlOn())try{await SQ.deleteMe()}catch(e){}return FS.deleteMe()};

 FB.force=m=>{if(m==="sql"&&sqlOn()&&act!=="sql"){act="sql";emit("sql","forced")}else if(m==="fs"&&act==="sql"){act="fs";emit("fs","forced")}};
 FB.sqlStatus=async()=>({cfg:sqlOn(),act,sess:sqlOn()?await getSess():false,err:mirrorErr});

 FB.copy=async dir=>{if(!sqlOn())throw new Error("SQL backup is not configured");return dir==="fs2sql"?SQ.copyFsToSql():SQ.copySqlToFs()};
 FB.__onErr=e=>{if(quota(e))toSql("read")};
 return FB}
//ROUTER-END
const FB=buildRouter({FS,SQ,sqlOn:()=>!!SB,emit:(act,why)=>window.dispatchEvent(new CustomEvent("db-switch",{detail:{act,why}})),getSess:async()=>{try{const r=await SB.auth.getSession();return !!(r.data&&r.data.session)}catch(e){return false}}});
onErrHook=FB.__onErr;
